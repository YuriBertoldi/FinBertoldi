name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fincontrol
          POSTGRES_PASSWORD: fincontrol
          POSTGRES_DB: fincontrol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fincontrol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v -count=1

      - name: Integration tests (PostgreSQL)
        env:
          DATABASE_URL: postgres://fincontrol:fincontrol@localhost:5432/fincontrol?sslmode=disable
          INTEGRATION_REQUIRED: "1"
        run: go test -tags=integration ./internal/store/ ./internal/integrations/ -v -count=1

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/ubuntu/finBertoldi
            git pull origin main
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build app pluggy-service
