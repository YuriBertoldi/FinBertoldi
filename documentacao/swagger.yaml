  # ==================== PLUGGY SERVICE (porta 8081) ====================
  /api/pluggy/status:
    get:
      tags: [Pluggy Service]
      summary: Health check do microservico
      servers:
        - url: http://localhost:8081
      responses:
        '200':
          description: Servico online
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/pluggy/connect-token:
    post:
      tags: [Pluggy Service]
      summary: Gerar connect token Pluggy
      servers:
        - url: http://localhost:8081
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                clientUserId:
                  type: string
      responses:
        '200':
          description: Token gerado
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string

  /api/pluggy/webhook:
    post:
      tags: [Pluggy Service]
      summary: Webhook da Pluggy
      description: Recebe eventos item/created e item/updated
      servers:
        - url: http://localhost:8081
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  enum: [item/created, item/updated]
                id:
                  type: string
                  description: ID do item
      responses:
        '200':
          description: Webhook processado

  /api/pluggy/items:
    post:
      tags: [Pluggy Service]
      summary: Registrar item conectado
      servers:
        - url: http://localhost:8081
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [itemId, familyId]
              properties:
                itemId:
                  type: string
                familyId:
                  type: integer
                connectorName:
                  type: string
      responses:
        '200':
          description: Item registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /api/pluggy/sync/{item_id}:
    post:
      tags: [Pluggy Service]
      summary: Forcar sync de um item
      servers:
        - url: http://localhost:8081
      parameters:
        - name: item_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sync concluido
          content:
            application/json:
              schema:
                type: object
                properties:
                  synced:
                    type: integer
                    description: Numero de novas transacoes

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Cookie de sessao HTTP-only (token hex 64 chars)
