{{define "forgot_password"}}
<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1419">
  <title>Recuperar Senha — FinBertoldi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%; width: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
      background:
        radial-gradient(circle at 20% 20%, rgba(39, 174, 96, 0.15), transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(41, 128, 185, 0.12), transparent 50%),
        linear-gradient(135deg, #0f1419 0%, #1a2332 100%);
      color: #e6e9ed;
    }
    .card {
      width: 100%; max-width: 420px;
      background: rgba(26, 32, 44, 0.85);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px; padding: 2.5rem 2.25rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
    }
    .brand { text-align: center; margin-bottom: 2rem; }
    .brand-logo {
      display: inline-flex; align-items: center; justify-content: center;
      width: 64px; height: 64px; border-radius: 18px;
      background: linear-gradient(135deg, #27ae60, #1e8449);
      font-size: 2rem; margin-bottom: 1rem;
      box-shadow: 0 8px 24px rgba(39, 174, 96, 0.35);
    }
    .brand-title { font-size: 1.5rem; font-weight: 800; margin: 0 0 .35rem; color: #fff; }
    .brand-subtitle { font-size: .9rem; color: #8b95a7; margin: 0; }
    .msg-box {
      background: rgba(39, 174, 96, 0.12); border: 1px solid rgba(39, 174, 96, 0.35);
      color: #7dcea0; padding: .75rem 1rem; border-radius: 10px;
      font-size: .88rem; margin-bottom: 1.25rem; text-align: center;
    }
    form { margin: 0; }
    .field { margin-bottom: 1.1rem; }
    .field label { display: block; font-size: .8rem; font-weight: 600; color: #b0b8c4; margin-bottom: .4rem; }
    .field input {
      width: 100%; padding: .8rem 1rem;
      background: rgba(15, 20, 25, 0.6); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px; color: #fff; font-size: 16px; font-family: inherit;
      transition: border-color .15s, background .15s, box-shadow .15s; outline: none;
    }
    .field input::placeholder { color: #5a6478; }
    .field input:focus { border-color: #27ae60; background: rgba(15, 20, 25, 0.85); box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.15); }
    .submit-btn {
      width: 100%; padding: .85rem 1rem;
      background: linear-gradient(135deg, #27ae60, #1e8449);
      border: none; border-radius: 10px; color: #fff;
      font-size: .95rem; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: transform .15s, box-shadow .15s, filter .15s; margin-top: .5rem;
    }
    .submit-btn:hover { filter: brightness(1.1); box-shadow: 0 8px 24px rgba(39, 174, 96, 0.35); transform: translateY(-1px); }
    .back-link { display: block; text-align: center; margin-top: 1rem; color: #8b95a7; font-size: .85rem; text-decoration: none; }
    .back-link:hover { color: #27ae60; }
    @media (max-width: 480px) {
      body { padding: 1rem; align-items: flex-start; padding-top: 2rem; }
      .card { padding: 1.75rem 1.25rem; border-radius: 16px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-logo">🔑</div>
      <h1 class="brand-title">Recuperar Senha</h1>
      <p class="brand-subtitle">Informe seu email para receber o link</p>
    </div>

    {{if .Msg}}
    <div class="msg-box">{{.Msg}}</div>
    {{end}}

    <form method="POST" action="/forgot-password">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" name="email" placeholder="seu@email.com" required autofocus autocomplete="email">
      </div>
      <button type="submit" class="submit-btn">Enviar Link de Recuperacao</button>
    </form>

    <a href="/login" class="back-link">Voltar ao login</a>
  </div>
</body>
</html>
{{end}}
