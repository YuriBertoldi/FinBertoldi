services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: fincontrol
      DB_PASS: fincontrol
      DB_NAME: fincontrol
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fincontrol
      POSTGRES_PASSWORD: fincontrol
      POSTGRES_DB: fincontrol
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincontrol"]
      interval: 5s
      timeout: 5s
      retries: 5

  pluggy-service:
    build: ./pluggy-service
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://fincontrol:fincontrol@postgres:5432/fincontrol?sslmode=disable
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-sandbox}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-sandbox}
      SYNC_INTERVAL: 6h
      PORT: 8081
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
